[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmfs"
version = "1.0.0"
description = "An educational, from-scratch decoder-only language model with fast training and KV-cached inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LLM From Scratch contributors"}]
dependencies = ["torch>=2.5,<3", "numpy>=1.24,<3", "PyYAML>=6,<7", "safetensors>=0.4,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
llmfs = "llmfs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["exercises"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
