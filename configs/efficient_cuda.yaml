# Starter single-GPU configuration. Tune batch/accumulation to your VRAM.
# Requires CUDA with bf16 support; switch precision to fp16 otherwise.
model:
  block_size: 256
  n_layer: 6
  n_head: 6
  n_kv_head: 2
  n_embd: 384
  dropout: 0.0
  bias: false
  tie_weights: true
  norm: rmsnorm
  position: rope
  mlp: swiglu
  fused_qkv: true
  attention_impl: sdpa
train:
  batch_size: 12
  grad_accum_steps: 4
  steps: 2000
  learning_rate: 0.0004
  min_lr: 0.00004
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 100
  eval_batches: 20
  log_interval: 20
  save_interval: 100
  seed: 1337
  device: cuda
  precision: bf16
  optimizer: auto
  compile: false  # turn on after eager path works, measure compilation overhead
  compile_mode: default
  batch_device: cpu  # 'device' when entire prepared corpus fits in VRAM
  tf32: true
